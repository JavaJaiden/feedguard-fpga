name: FeedGuard FPGA verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          mkdir -p out/rtl
          { python3 --version; iverilog -V; yosys -V; } > out/tool-versions.txt 2>&1
      - name: Python tests
        run: python3 -m unittest -v 2>&1 | tee out/python-tests.log
      - name: RTL tests
        run: python3 sim/check_rtl.py 2>&1 | tee out/rtl-tests.log
      - name: Demo
        run: |
          python3 feedguard.py --output out/feedguard.json
      - name: Generic structural checks
        run: |
          for top in omdc_envelope sequence_guard feedguard_top; do
            yosys -Q -T -p "read_verilog -sv rtl/feedguard.sv; hierarchy -check -top $top; proc; opt; check -assert; stat" | tee "out/${top}-synthesis.log"
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feedguard-fpga-${{ github.sha }}
          path: out/
          retention-days: 14

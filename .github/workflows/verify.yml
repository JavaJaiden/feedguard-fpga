name: FeedGuard FPGA verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          mkdir -p out/rtl
          { python3 --version; iverilog -V; yosys -V; } > out/tool-versions.txt 2>&1
      - name: Verify Python, integrated RTL, demos and generic synthesis
        run: python3 verify.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feedguard-fpga-${{ github.sha }}
          path: out/
          retention-days: 14
